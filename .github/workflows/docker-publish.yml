name: DockerHub Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: khapra/xtension-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Validate image VERSION matches VERSION file
        run: |
          version_git=$(cat VERSION)
          echo "Expected version: $version_git"
          docker pull ${{ env.IMAGE_NAME }}:latest
          version_in_image=$(docker run --rm --entrypoint cat ${{ env.IMAGE_NAME }}:latest /app/VERSION)
          echo "Image version: $version_in_image"
          if [ "$version_git" != "$version_in_image" ]; then
            echo "❌ ERROR: VERSION mismatch: file ($version_git) vs image ($version_in_image)"
            exit 1
          fi
          
      # --- ReadMe Sync
      - name: Sync DockerHub README (peter-evans action)
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./README.md
                    
      # --- (Optional) Github release note automation - update with version if tag push ---
      - name: Create GitHub Release (if on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VERSION
            README.md
            plugins/README.md