version: '3.8'

services:
  xtension-bot:
    build: .
    container_name: xtension-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_ID: ${API_ID:-}
      API_HASH: ${API_HASH:-}
      SESSION_TYPE: ${SESSION_TYPE:-sqlite}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
      ENABLE_PLUGINS: ${ENABLE_PLUGINS:-true}
    volumes:
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./plugins:/app/plugins:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
