version: '1.1.0'

services:
  xtension-bot:
    build: .
    container_name: xtension-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_ID: ${API_ID:-}
      API_HASH: ${API_HASH:-}
      SESSION_TYPE: ${SESSION_TYPE:-sqlite}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_PLUGINS: ${ENABLE_PLUGINS:-true}
      ADMIN_IDS: ${ADMIN_IDS:-}
      PLUGIN_DIR: ${PLUGIN_DIR:-plugins}
      DATA_DIR: ${DATA_DIR:-data}
      SESSION_DIR: ${SESSION_DIR:-sessions}
    volumes:
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./plugins:/app/plugins:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
